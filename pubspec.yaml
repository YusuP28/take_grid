name: take_grid
description: Take Grid — aplikasi grid foto untuk Android
publish_to: 'none'
version: 1.1.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Database (project history)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Image
  image_picker: ^1.1.2
  image: ^4.2.0
  photo_manager: ^3.6.3

  # File & share
  file_picker: ^8.1.2
  share_plus: ^10.0.2

  # UI
  flutter_colorpicker: ^1.1.0
  permission_handler: ^11.3.1
  media_store_plus: ^0.1.3
  screenshot: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/templates/
    - assets/stickers/
    - assets/icons/
